name: Refresh validated proxies
on:
  workflow_dispatch:
  schedule:
    - cron: "13 * * * *"

permissions:
  contents: write

concurrency:
  group: zaz-hourly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Download latest MaxMind GeoLite2 Country database
        shell: bash
        env:
          MAXMIND_ACCOUNT_ID: ${{ secrets.MAXMIND_ACCOUNT_ID }}
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
        run: |
          set -euo pipefail
          : "${MAXMIND_ACCOUNT_ID:?Add MAXMIND_ACCOUNT_ID under Actions repository secrets}"
          : "${MAXMIND_LICENSE_KEY:?Add MAXMIND_LICENSE_KEY under Actions repository secrets}"
          mkdir -p "$RUNNER_TEMP/zaz-geoip"
          curl --fail --silent --show-error --location --retry 3 \
            --user "$MAXMIND_ACCOUNT_ID:$MAXMIND_LICENSE_KEY" \
            'https://download.maxmind.com/geoip/databases/GeoLite2-Country/download?suffix=tar.gz' \
            --output "$RUNNER_TEMP/zaz-geoip/GeoLite2-Country.tar.gz"
          tar -xzf "$RUNNER_TEMP/zaz-geoip/GeoLite2-Country.tar.gz" \
            -C "$RUNNER_TEMP/zaz-geoip"
          DB="$(find "$RUNNER_TEMP/zaz-geoip" -type f -name GeoLite2-Country.mmdb -print -quit)"
          if [ -z "$DB" ] || [ ! -s "$DB" ]; then
            echo "::error::GeoLite2-Country.mmdb was not found in MaxMind download"
            exit 1
          fi
          echo "GEOIP_DB_PATH=$DB" >> "$GITHUB_ENV"
      - name: Fetch, geolocate and validate proxy candidates
        run: python zaz.py
      - name: Commit refreshed proxy lists
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- working_proxies last_run.json
          if git diff --cached --quiet; then
            echo "No output changes"
            exit 0
          fi
          git commit -m "Refresh working proxies [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "Published successfully"
              exit 0
            fi
            echo "Retry $attempt"
            sleep 10
          done
          echo "::error::Unable to push refreshed proxy lists"
          exit 1
